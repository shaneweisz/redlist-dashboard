models:
  - name: link_audit
    description: One row per assessed species, with the evidence for checking its CoL link (see the header in link_audit.sql).
    columns:
      - name: sis_taxon_id
        data_tests: [unique, not_null]
      - name: stratum
        data_tests:
          - accepted_values:
              arguments:
                values: [exact, synonym, checklist_synonym, decision, unmatched]

unit_tests:
  - name: link_audit_signals
    description: >
      A link made by exact name, one through a CoL synonym that IUCN itself lists,
      and an unreviewed decision. An order CoL only renames (Pinales holding
      Cupressales) is not a difference; a genus transfer is; IUCN listing CoL's
      accepted name among its synonyms backs the link.
    model: link_audit
    given:
      - input: source('core', 'assessments')
        format: sql
        rows: |
          SELECT * FROM (VALUES
            (1::BIGINT, true, 'Juniperus communis', 'L.', 'plants', DATE '2013-01-01', 'PINOPSIDA', 'PINALES', 'CUPRESSACEAE', []::STRUCT(name VARCHAR, status VARCHAR)[]),
            (2, true, 'Glossopsitta porphyrocephala', '(Dietrichsen, 1837)', 'birds', DATE '2016-10-01', 'AVES', 'PSITTACIFORMES', 'PSITTACIDAE',
               [{'name': 'Parvipsitta porphyrocephala', 'status': 'SYNONYM'}]),
            (3, true, 'Odd thing', 'Smith, 1900', 'mammals', DATE '2020-01-01', 'MAMMALIA', 'RODENTIA', 'MURIDAE', []::STRUCT(name VARCHAR, status VARCHAR)[])
          ) t(sis_taxon_id, is_latest, scientific_name, authority, taxon_group, assessment_date, class_name, order_name, family, synonyms)
      - input: source('core', 'assessment_link')
        format: sql
        rows: |
          SELECT * FROM (VALUES
            (1::BIGINT, 'primary', 'C1', 'C1', 'accepted', 'matcher', NULL),
            (2, 'primary', 'C2', 'S2', 'synonym', 'matcher', NULL),
            (3, 'primary', 'C3', 'C3', 'accepted', 'decision', 'heuristic')
          ) t(sis_taxon_id, role, col_id, usage_id, method, basis, decided_by)
      - input: source('core', 'taxa')
        format: sql
        rows: |
          SELECT * FROM (VALUES
            ('C1', 'Juniperus communis', 'L.', 1753, 'Pinopsida', 'Cupressales', 'Cupressaceae'),
            ('C2', 'Parvipsitta porphyrocephala', '(Dietrichsen, 1837)', 1837, 'Aves', 'Psittaciformes', 'Psittaculidae'),
            ('S2', 'Glossopsitta porphyrocephala', '(Dietrichsen, 1837)', 1837, 'Aves', 'Psittaciformes', 'Psittaculidae'),
            ('C3', 'Odd thing', 'Smith, 1901', 2021, 'Mammalia', 'Eulipotyphla', 'Soricidae')
          ) t(col_id, scientific_name, authorship, described_year, class_name, order_name, family)
      - input: source('core', 'rank_aliases')
        format: sql
        rows: |
          SELECT * FROM (VALUES ('order', 'pinales', 'cupressales')) t(rank, name, alias)
    expect:
      rows:
        - {sis_taxon_id: 1, stratum: exact, decided_by: null, matched_name: null, genus_differs: false, order_differs: false, family_differs: false,
           author_year_differs: false, iucn_lists_col_name: false, described_after_assessment: false, signals: 0}
        - {sis_taxon_id: 2, stratum: synonym, decided_by: null, matched_name: Glossopsitta porphyrocephala, genus_differs: true, order_differs: false,
           family_differs: true, author_year_differs: false, iucn_lists_col_name: true, described_after_assessment: false, signals: 2}
        - {sis_taxon_id: 3, stratum: decision, decided_by: heuristic, matched_name: null, genus_differs: false, order_differs: true, family_differs: true,
           author_year_differs: true, iucn_lists_col_name: false, described_after_assessment: true, signals: 3}
