models:
  - name: specialist_group_species
    description: Which SSC Specialist Group each species is in (see the header in specialist_group_species.sql).
    columns:
      - name: sis_taxon_id
        description: An assessed species is in at most one group, so the lists can carry it as one column.
        data_tests: [unique]
      - name: col_id
        description: A CoL species is in at most one group, likewise.
        data_tests: [unique]

unit_tests:
  - name: specialist_group_rules
    description: >
      One species per rule specialist_group_species applies: an alias (CoL's
      Cupressales in a remit naming Pinales), the class standing in for a missing
      order, a section's catch-all leaving out what a claiming group holds, extra
      names, and the bison override, held by its own group and left out of every
      other.
    model: specialist_group_species
    given:
      - input: source('sources', 'specialist_group_remits')
        format: sql
        rows: |
          SELECT * FROM (VALUES
            ('conifers', 'plant-groups', ['plants'], [], [], ['pinales'], [], [], [], [], [], [], [], [], [], false, true),
            ('other-plants', 'plant-groups', ['plants'], [], ['mammalia'], [], [], [], [], [], [], [], [], [], [], true, false),
            ('carnivores', 'mammal-groups', ['mammals'], [], [], ['carnivora'], [], [], [], [], [], [], [], ['ailurus fulgens'], [], false, true),
            ('bison', 'mammal-groups', ['mammals'], [], [], [], [], [], [], ['bison'], [], [], [], [], ['bos bison'], false, false),
            ('bovids', 'mammal-groups', ['mammals'], [], [], [], [], ['bovidae'], [], [], [], [], [], [], [], false, false)
          ) t(group_id, section_id, taxon_groups, class_in, class_out, order_in, order_out, family_in, family_out,
              genus_in, genus_out, name_in, name_out, extra_names, override_names, catch_all, claims)
      - input: source('sources', 'rank_aliases')
        format: sql
        rows: |
          SELECT * FROM (VALUES ('order', 'pinales', 'cupressales')) t(rank, name, alias)
      - input: source('sources', 'assessments')
        format: sql
        rows: |
          SELECT *, true AS is_latest FROM (VALUES
            (1::BIGINT, 'plants', 'PINOPSIDA', 'PINALES', 'PINACEAE', 'Pinus nigra'),
            (2, 'mammals', 'MAMMALIA', 'CARNIVORA', 'FELIDAE', 'Panthera leo'),
            (3, 'mammals', 'MAMMALIA', 'CETARTIODACTYLA', 'AILURIDAE', 'Ailurus fulgens'),
            (4, 'mammals', 'MAMMALIA', 'CETARTIODACTYLA', 'BOVIDAE', 'Bison bison')
          ) t(sis_taxon_id, taxon_group, class_name, order_name, family, scientific_name)
      - input: source('sources', 'taxa')
        format: sql
        rows: |
          SELECT *, 'species' AS rank, 'accepted' AS status, false AS demoted FROM (VALUES
            ('C1', 'plants', 'Pinopsida', 'Cupressales', 'Cupressaceae', 'Juniperus communis'),
            ('C2', 'plants', 'Pinales', NULL, NULL, 'Pinus orphana'),
            ('C3', 'plants', 'Magnoliopsida', 'Rosales', 'Rosaceae', 'Rosa canina'),
            ('C4', 'mammals', 'Mammalia', 'Artiodactyla', 'Bovidae', 'Bos bison')
          ) t(col_id, taxon_group, class_name, order_name, family, scientific_name)
    expect:
      rows:
        - {sis_taxon_id: 1, col_id: null, group_id: conifers}
        - {sis_taxon_id: 2, col_id: null, group_id: carnivores}
        - {sis_taxon_id: 3, col_id: null, group_id: carnivores}
        - {sis_taxon_id: 4, col_id: null, group_id: bison}
        - {sis_taxon_id: 4, col_id: null, group_id: bovids}
        - {sis_taxon_id: null, col_id: C1, group_id: conifers}
        - {sis_taxon_id: null, col_id: C2, group_id: conifers}
        - {sis_taxon_id: null, col_id: C3, group_id: other-plants}
        - {sis_taxon_id: null, col_id: C4, group_id: bison}
