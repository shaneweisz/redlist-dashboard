# The tables the TypeScript stages before dbt write (sources/, link/), read
# where they lie in the build: one source per stage, as in core/.
sources:
  - name: sources
    description: The sources stage's tables (app/scripts/sync/sources/)
    config:
      meta:
        external_location: "read_parquet('{{ env_var('SYNC_BUILD_DIR') }}/core/sources/{name}.parquet')"
    tables:
      - name: taxa
        description: sources/taxa.ts
      - name: assessments
        description: sources/assessments.ts
      - name: occurrences
        description: sources/occurrences.ts
      - name: occurrence_countries
        description: sources/occurrences.ts
      - name: common_names
        description: sources/common-names.ts
      - name: specialist_group_remits
        description: sources/specialist-groups.ts (each SSC Specialist Group's remit)
      - name: rank_aliases
        description: sources/specialist-groups.ts (IUCN/CoL class and order aliases)
  - name: link
    description: The link stage's table (app/scripts/sync/link/)
    config:
      meta:
        external_location: "read_parquet('{{ env_var('SYNC_BUILD_DIR') }}/core/link/{name}.parquet')"
    tables:
      - name: assessment_link
        description: link/assessment-link.ts
