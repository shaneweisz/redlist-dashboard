# One DuckDB file per build, beside the tables the TypeScript stages write.
redlist_sync:
  target: build
  outputs:
    build:
      type: duckdb
      path: "{{ env_var('SYNC_BUILD_DIR') }}/core/sync.duckdb"
      threads: 8
      settings:
        memory_limit: "64GB"
        temp_directory: "{{ env_var('SYNC_DUCKDB_TMP') }}"
