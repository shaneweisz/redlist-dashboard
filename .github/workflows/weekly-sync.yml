name: Weekly data sync

# Refreshes GBIF occurrence counts, the Catalogue of Life backbone, and the
# derived taxa-summary stats (incl. isOutdated, which drifts stale over time
# even when no new data has arrived — see src/lib/outdated.ts) on a schedule,
# without needing the IUCN Postgres DB (see scripts/sync.ts's --skip-redlist:
# skips phase 1, fetch-redlist-species, plus phases 14-15, upload-range-maps/
# upload-aoh-maps, which need that same DB access or local-only STAR pipeline
# output). The Red List data itself stays on its own manual ~6-month refresh
# cadence (README § Data Sync Pipeline) — this job only refreshes everything
# downstream of it.
#
# Weekly (not monthly) so the resulting PR lands Sunday night and can be
# reviewed/merged Monday morning. Note the CoL backbone (phases 7-9) refetches
# its ~3.4GB ColDP export every run regardless of whether CoL has actually
# published anything new — CoL releases aren't weekly, so most weeks that step
# is pure overhead. Worth revisiting (e.g. skip phases 7-9 on some runs) if
# that turns out to be wasteful in practice.
#
# Safety notes (this repo is public — see README, IUCN license terms):
#   - schedule/workflow_dispatch only, never pull_request/pull_request_target,
#     so a malicious fork PR can never run with access to the secrets below
#     or tamper with this file (scheduled runs always use main's workflow).
#   - The R2 secrets live on the `data-sync` GitHub Environment (required
#     reviewer: the repo owner only), NOT as plain repo secrets — repo
#     secrets are usable by anyone with push access (here: 3 other
#     collaborators besides the owner), including via a workflow pushed to a
#     throwaway branch and run with workflow_dispatch, which never touches
#     main/PR review at all. Environment protection closes that gap: ANY job
#     that declares `environment: data-sync` — regardless of which branch or
#     how the workflow got there — pauses for the owner's manual approval
#     before the secrets are released to it.
#   - Only R2 credentials are needed — every GBIF/CoL API this pipeline calls
#     is public/unauthenticated (verified: no script here reads a GBIF/CoL
#     API key or token).
#   - The PR step stages an explicit file allowlist, never `git add -A`/`.`,
#     so the ~400MB of raw per-species data (gitignored, private-R2-only)
#     can never accidentally end up in a commit — only the small, already-
#     committed aggregate/config files staged explicitly below.
#   - Every script in this pipeline only logs aggregate counts/durations,
#     never per-species rows, so the (publicly-visible) Action logs are safe.

on:
  schedule:
    # 20:00 UTC every Sunday — Sunday evening in the UK (BST/GMT depending on
    # DST, so ~9pm or ~8pm local), leaving the resulting PR ready to review
    # and merge Monday morning.
    - cron: "0 20 * * 0"
  workflow_dispatch: {} # allows a manual test run from the Actions tab

permissions:
  contents: write
  pull-requests: write

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_DATA_BUCKET_NAME: ${{ secrets.R2_DATA_BUCKET_NAME }}

jobs:
  sync:
    runs-on: ubuntu-latest
    # Gates this whole job behind the data-sync environment's required-reviewer
    # rule — see the safety notes above. Every run (scheduled, dispatched, or
    # from any branch) pauses here until the owner approves it in the Actions
    # tab, which is also where you'd notice an unexpected/unfamiliar run.
    environment: data-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Fetch current data from R2
        run: npm run fetch-data-from-r2
        working-directory: app

      - name: Run sync (phases 2-13 — GBIF, CoL backbone, matching, taxa-summary)
        run: npx tsx scripts/sync.ts --skip-redlist
        working-directory: app

      - name: Diff vs the live R2 sync
        id: diff
        run: |
          npm run diff-data-vs-r2 | tee /tmp/diff-output.txt
          # The git-tracked pipeline configs count as a change too, not just the
          # data. When GBIF moves to a new Catalogue of Life release, phase 2 and
          # phase 4b rewrite col-release.json and gbif-taxon-keys.json; if the
          # resulting data happened to be byte-identical this step would report
          # "no change", skip the PR, and throw both away — so next week would
          # redo the whole 3.4GB rebuild, and every week after that.
          if git diff --quiet -- src/config/ && grep -q "No differences" /tmp/diff-output.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: app

      - name: Upload new sync to R2
        if: steps.diff.outputs.changed == 'true'
        run: npm run upload-data-to-r2
        working-directory: app

      - name: Open a PR bumping the sync pointer
        if: steps.diff.outputs.changed == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TS=$(cat latest-sync.txt)
          BRANCH="data-sync/$TS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Explicit allowlist ONLY — see the safety notes above. Never `git add
          # -A`/`.` here: data/ holds ~400MB of raw per-species data that must
          # never touch git, only these small, already-committed aggregate files.
          # Keep this list in exact sync with app/.gitignore's `!/data/...`
          # exceptions: 7 dual git-tracked-and-R2-published data/ files, plus
          # col-revisions.json, which the repo owns outright — it is the one
          # tracked file NOT re-uploaded to R2, because it carries the card's
          # reason codes and those have to ship with the code that reads them
          # (see EXCLUDE_FROM_SYNC in upload-data-to-r2.ts). Committing it here
          # is therefore how a sync's flag changes reach production at all.
          # Plus the 2 git-tracked src/config/ pipeline outputs — data/node-children-
          # summaries.json (referenced here until now) was split into the two
          # table1a-/ssc-group- files below a while back and this list was never
          # updated, so this step would have failed with "pathspec did not match
          # any files" on the next run to actually reach it.
          git add latest-sync.txt data/taxa-summary.json data/table1a-children-summaries.json data/ssc-group-children-summaries.json data/country-stats.json data/vernacular-names.json data/col-split-candidates.parquet data/col-synonym-assessed.parquet data/col-to-assessed.parquet data/col-revisions.json
          # gbif-taxon-keys.json is regenerated by phase 4b whenever GBIF moves to
          # a new Catalogue of Life release, because the group root keys are CoL
          # ids and get renumbered like any other usage — Rhodophyta and Blattodea
          # both changed between COL26.6 and 26.7, and Rhodophyta is red_algae's
          # only key. If it is not committed back, the next run starts from the
          # stale keys again and fails the same way, forever.
          git add src/config/col-taxon-ids.json src/config/col-release.json src/config/gbif-taxon-keys.json

          if git diff --cached --quiet; then
            echo "Nothing to commit — skipping PR."
            exit 0
          fi

          git commit -m "Bump data sync to $TS"
          git push origin "$BRANCH"
          gh pr create \
            --title "Bump data sync to $TS" \
            --body "$(printf '%s\n\n## Per-group regression check\n\n%s\n' \
              "Automated weekly sync (phases 2-13: GBIF occurrence counts, CoL backbone, matching, taxa-summary). The Red List DB fetch (phase 1) is skipped and stays on its own manual ~6-month cadence. Review the diff before merging — merging is what flips production to this sync." \
              "$(cat sync-regressions.md 2>/dev/null || echo '_The regression check did not produce a report — treat this sync as unverified._')")" \
            --base main \
            --head "$BRANCH"
