name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # The sync's count and lists tests run its dbt models (app/scripts/sync/dbt), through uv.
      # From PyPI rather than astral-sh/setup-uv, which downloads any uv newer than its
      # bundled list (0.8.x) from GitHub release assets, a download that has been
      # returning 504s. Pinned, so CI runs the uv the lockfile was made with.
      - name: Install uv
        run: pipx install uv==0.11.27

      # dbt-oss installs by downloading its binary from GitHub release assets, the
      # same host, so uv's cache (which keeps the built package) is kept between runs,
      # keyed on the lockfile: a new download only when the dbt version changes. Saved
      # right after the install, so a later failing test can't keep it from being saved.
      - name: Restore uv's cache
        id: uv-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('app/scripts/sync/dbt/uv.lock') }}

      - name: Install the sync's dbt
        run: uv sync --project app/scripts/sync/dbt

      - name: Save uv's cache
        if: steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('app/scripts/sync/dbt/uv.lock') }}

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: app

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/ci/coverage-report.mjs
        working-directory: app

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Lint
        run: npm run lint
        working-directory: app

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Type check
        run: npx tsc --noEmit
        working-directory: app
